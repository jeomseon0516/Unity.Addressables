name: Package Validation

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate package
        run: |
          jq empty package.json
          test "$(jq -r '.name' package.json)" = "com.jeomseon.unity.addressables"
          test "$(jq -r '.unity' package.json)" = "6000.6"
          test "$(jq -r '.dependencies["com.unity.addressables"]' package.json)" = "2.9.1"
          test "$(jq -r '.dependencies["com.jeomseon.unity.core"]' package.json)" = "null"
          test -f README.md
          test -f README.en.md
          test -f CHANGELOG.md
          test -f LICENSE.md
          test -f Tests/Runtime/Jeomseon.Unity.Addressables.PlayModeTests.asmdef
      - name: Validate Unity meta files
        shell: bash
        run: |
          while IFS= read -r asset; do
            if [ ! -f "${asset}.meta" ]; then
              echo "::error file=${asset}::Missing Unity meta file: ${asset}.meta"
              exit 1
            fi
          done < <(find Runtime Editor Tests Samples~ -mindepth 1 ! -name '*.meta' -print)
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "$(jq -r '.version' package.json)" = "${GITHUB_REF_NAME#v}"
